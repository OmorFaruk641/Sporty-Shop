<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Project 1</title>
	<link rel="stylesheet" href="style.css">
	<style>
		body{
			background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsBPrphwHsrwyIzPqeOj240iZxGJkwpgwZipXlo3p5ug&s=10");
			background-size: cover;
			background-position: center;
			background-attachment: fixed;
		}
		form{
			background-color: rgba(0,0,0,0.5);
			width: 90%;
			padding: 50px;
			border: 5px solid black;
			border-radius: 10px;
			color: black;
			margin: auto;
		}
		h1{
			color: white;
			width: 100%;
			text-align: center;
			background-color: rgba(0,0,0,1);
			border: 2px solid #ffcf8c;
			padding: 5px;
			position: sticky;
			top: 0;
		}
		button[type="submit"]{
			width: 50%;
			background: #ffcf8c;
			padding: 5px 10px;
			color: black;
			border: 2px solid black;
			border-radius: 50px;
			margin: auto;
			display: block;
			margin-bottom: 5px;
		}
		button[type="submit"]:hover{
			background: green;
		}

		button[type="reset"]{
			width: 50%;
			background: #ffcf8c;
			padding: 5px 10px;
			color: black;
			border: 2px solid black;
			border-radius: 50px;
			margin: auto;
			display: block;
		}
		button[type="reset"]:hover{
			background: red;
		}
		label{
			display: inline-block;
			width: 120px;
		}
		input[type="text"],
		input[type="number"],
		input[type="date"],
		input[type="email"],
		input[type="password"]{
			width: 90%;
			border: 2px solid black;
			padding: 5px 10px;
			border-radius: 5px;
		}
		select{
			width: 100%;
			border: 2px solid black;
			border-radius: 5px;
			padding: 5px 10px;
		}
		textarea{
			border: 2px solid black;
			border-radius: 5px;
		}
		fieldset{
			background: rgba(255,215,150,0.8);
			border: 2px solid black;
			border-radius: 8px;
		}
		h3{
			background: white;
			border: 2px solid black;
			border-radius: 10px;
			padding: 5px 10px;
		}
		h5{
			color: white;
			text-align: center;
		}
	</style>
</head>
<body>
	<form action="confirm_page.html" target="_blank" >
		
		<h1>Sign up</h1>
		
			<fieldset> 
					<legend><h3>Personal Information:</h3></legend>
				<label for="name">First name: </label>
				<input type="text" id="name" placeholder="Example: Omor" required>
			<br><br>	
				<label for="name">Last name: </label>
				<input type="text" id="name" placeholder="Example: Faruk" required>
			<br><br>
		
				<label for="number">Mobile number: </label>
				<input type="number" id="number" placeholder="Example: 013***641" required>
			<br><br>
			
				<label for="date">Date of birth: </label>
				<input type="date" id="date">
			<br><br>
		
				<label for="email">E-mail: </label>
				<input type="email" id="email" placeholder="Example: omor@gmail.com" required>
			<br><br>
		
				<label for="password">Password: </label>
				<input type="password" id="password" placeholder="Example: kjhs324$%&" required>
			<br><br>
			</fieldset>
			
			<fieldset>
				<legend><h3>Gender:</h3></legend>
				<input type="radio" value="male" name="gender" id="male"><label for="male">Male</label><br>
				<input type="radio" value="female" name="gender" id="female"><label for="female">Female</label><br>
				<input type="radio" value="others" name="gender" id="others"><label for="others">Others</label>
			</fieldset>
				
			<fieldset>
				<legend><h3>User type:</h3></legend>
				<input type="checkbox" name="" value="user_type" id="buyer"><label for="buyer">Buyer</label><br>
				<input type="checkbox" name="" value="user_type" id="seller"><label for="seller">Seller</label>
			</fieldset>
			
			<fieldset>
			<legend><h3>Select your edocational qualification: </h3></legend>
				<select name="edu" id="edu">
					<option value="Select">Select</option>
					<option value="PSC">PSC</option>
					<option value="JSC">JSC</option>
					<option value="SSC">SSC</option>
					<option value="HSC">HSC</option>
					<option value="Diploma">Diploma</option>
					<option value="BSC">BSC</option>
				</select>
			<br><br>
			</fieldset>
			
			<fieldset>
				<legend><h3>Discription</h3></legend>
				<textarea name="discription" id="discription" cols="30" rows="10" placeholder="Write about yourself"></textarea>
			<br><br>
			</fieldset>
			<br><br>	
			
			<button type="submit">Sign up</button>
			<button type="reset">Cancel</button>
			
			<h5>Already have a account? <a href="loginform.html">Login</a></h5>
	</form>
</body>
</html>
