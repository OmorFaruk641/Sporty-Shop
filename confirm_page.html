<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Confirm Page</title>
	<style>
		body{
		background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsBPrphwHsrwyIzPqeOj240iZxGJkwpgwZipXlo3p5ug&s=10");
		background-size: cover;
		background-position: center;
		background-attachment: fixed;
		display: flex;
		justify-content: center;
		align-items: center;
		min-height: 100vh;
		margin: auto;
		}
		div{
			background-color: rgba(0,0,0,0.5);
			width: 80%;
			height: 200px;
			margin: auto;
			border: 4px solid #ffcf8c;
			border-radius: 20px;
		}
		button{
			background: #ffcf8c;
			border: 2px solid black;
			border-radius: 20px;
			display: block;
			margin: auto;
			padding: 10px 20px;
			color: black;
		}
		button:hover{
			background: lightgreen;
		}
		a{
			text-decoration: none;
			color: black;
		}
		h1{
			padding: 30px 50px;
			text-align: center;
			color: white;
		}
	</style>
</head>
<body>
	<div>
		<h1>Congratulation! Login successfull 😃</h1>
		<button><a href="webpage.html" target="_blank">Go to the shop</a></button>
	</div>
</body>
</html>
